<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduMate - College Shortlist</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #071426;
            color: #e8f0f8;
        }

        header {
            background: #091a2e;
            border-bottom: 1px solid #1c3854;
            padding: 18px 7%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #4da3ff;
            font-size: 28px;
            font-weight: 700;
        }

        .subtitle {
            color: #8fa8c0;
            margin-top: 3px;
        }

        .back {
            background: #1769aa;
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .back:hover {
            background: #2180ca;
        }

        main {
            width: 86%;
            max-width: 1200px;
            margin: 35px auto;
        }

        .hero {
            background: linear-gradient(135deg, #0d3155, #145c91);
            border: 1px solid #27648f;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 28px;
        }

        .hero h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        .hero p {
            margin: 0;
            color: #c3d8ea;
            font-size: 17px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .toolbar button {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #294866;
            background: #0c1e33;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }

        .toolbar button:hover {
            border-color: #4da3ff;
            background: #102942;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .college {
            background: #0c1e33;
            border: 1px solid #1c3854;
            border-radius: 15px;
            padding: 23px;
            transition: 0.2s;
        }

        .college:hover {
            border-color: #2d75ad;
            transform: translateY(-2px);
        }

        .college h2 {
            margin: 0 0 8px;
            color: #edf5fc;
            font-size: 21px;
        }

        .college p {
            color: #9db2c8;
            margin: 7px 0;
        }

        .college-info {
            margin: 15px 0;
            padding: 14px;
            background: #08192b;
            border-radius: 8px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 7px 0;
            border-bottom: 1px solid #18314a;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #8fa8c0;
            font-weight: 600;
        }

        .info-value {
            color: #e8f0f8;
            text-align: right;
        }

        .tags {
            margin-top: 12px;
        }

        .tag {
            display: inline-block;
            background: #12385d;
            color: #8dccff;
            padding: 5px 9px;
            border-radius: 5px;
            margin: 3px;
            font-size: 12px;
        }

        .remove {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #873737;
            background: #612525;
            color: white;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
        }

        .remove:hover {
            background: #873737;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: #0c1e33;
            border: 1px solid #1c3854;
            border-radius: 15px;
            color: #8fa8c0;
        }

        .empty h2 {
            color: #e8f0f8;
        }

        .empty .back {
            margin-top: 15px;
        }

        @media(max-width:700px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .toolbar {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="header">

            <div>
                <div class="logo">EduMate</div>
                <div class="subtitle">College Shortlist</div>
            </div>

            <button class="back" onclick="location.href='index.html'">
                ← Dashboard
            </button>

        </div>
    </header>


    <main>

        <section class="hero">

            <h1>⭐ My College Shortlist</h1>

            <p>
                Keep your preferred colleges together and compare
                them before making your admission decisions.
            </p>

        </section>


        <div class="toolbar">

            <button onclick="location.href='compare.html'">
                ⚖️ Compare Shortlisted Colleges
            </button>

            <button onclick="clearShortlist()">
                Clear Shortlist
            </button>

        </div>


        <div id="collegeGrid" class="grid"></div>

    </main>


    <script>

        /*
            The predictor and shortlist use slightly different
            property names. These helper functions make this page
            compatible with both.
        */

        function getValue(college, possibleNames) {

            for (const name of possibleNames) {

                if (
                    college[name] !== undefined &&
                    college[name] !== null &&
                    college[name] !== ""
                ) {
                    return college[name];
                }
            }

            return "Not available";
        }


        function getCollegeName(college) {

            return getValue(college, [
                "name",
                "college",
                "college_name",
                "collegeName",
                "institute",
                "institution",
                "institution_name"
            ]);
        }


        function getCity(college) {

            return getValue(college, [
                "city",
                "location",
                "district"
            ]);
        }


        function getType(college) {

            return getValue(college, [
                "type",
                "institution_type",
                "college_type"
            ]);
        }


        function getBranch(college) {

            return getValue(college, [
                "branch",
                "branches",
                "branch_name",
                "course"
            ]);
        }


        function getFees(college) {

            return getValue(college, [
                "fees",
                "fee",
                "annual_fees",
                "approx_fees"
            ]);
        }


        function getCutoff(college) {

            return getValue(college, [
                "latest_cutoff",
                "cutoff",
                "cutoff_percentile",
                "percentile"
            ]);
        }


        function getCategory(college) {

            return getValue(college, [
                "category",
                "chance",
                "admission_chance",
                "recommendation"
            ]);
        }


        function getDifference(college) {

            const value = getValue(college, [
                "difference",
                "cutoff_difference"
            ]);

            if (value === "Not available") {
                return value;
            }

            return value;
        }


        /*
            Load the shortlist.
        */

        function getShortlist() {

            const saved =
                localStorage.getItem("edumateShortlist");

            if (!saved) {
                return [];
            }

            try {
                return JSON.parse(saved);
            }

            catch {
                return [];
            }
        }


        /*
            Render shortlisted colleges.
        */

        function render() {

            const grid =
                document.getElementById("collegeGrid");

            const shortlist =
                getShortlist();


            if (shortlist.length === 0) {

                grid.innerHTML = `

                <div class="empty">

                    <h2>
                        No colleges shortlisted yet 💙
                    </h2>

                    <p>
                        Go to the College Predictor and add
                        colleges to your shortlist.
                    </p>

                    <button
                        class="back"
                        onclick="location.href='predictor.html'"
                    >
                        Open College Predictor
                    </button>

                </div>

            `;

                return;
            }


            grid.innerHTML = shortlist.map((college, index) => {

                const name = getCollegeName(college);
                const city = getCity(college);
                const type = getType(college);
                const branch = getBranch(college);
                const fees = getFees(college);
                const cutoff = getCutoff(college);
                const category = getCategory(college);
                const difference = getDifference(college);


                /*
                    Use the stored id if available.
                    Otherwise use the array index.
                */

                const id =
                    college.id !== undefined
                        ? college.id
                        : index;


                return `

                <div class="college">

                    <h2>
                        ${name}
                    </h2>

                    <p>
                        📍 ${city}
                    </p>


                    <div class="college-info">

                        <div class="info-row">

                            <span class="info-label">
                                Branch
                            </span>

                            <span class="info-value">
                                ${branch}
                            </span>

                        </div>


                        <div class="info-row">

                            <span class="info-label">
                                Admission Category
                            </span>

                            <span class="info-value">
                                ${category}
                            </span>

                        </div>


                        <div class="info-row">

                            <span class="info-label">
                                Latest Cutoff
                            </span>

                            <span class="info-value">
                                ${cutoff}
                            </span>

                        </div>


                        <div class="info-row">

                            <span class="info-label">
                                Difference
                            </span>

                            <span class="info-value">
                                ${difference}
                            </span>

                        </div>

                    </div>


                    <div class="tags">

                        <span class="tag">
                            ${type}
                        </span>

                        <span class="tag">
                            ${branch}
                        </span>

                        <span class="tag">
                            Cutoff: ${cutoff}
                        </span>

                    </div>


                    <button
                        class="remove"
                        onclick="removeCollege(${index})"
                    >
                        Remove from Shortlist
                    </button>

                </div>

            `;

            }).join("");

        }


        /*
            Remove by ARRAY INDEX.
    
            This is safer than relying on IDs because
            predictor datasets can have duplicate or missing IDs.
        */

        function removeCollege(index) {

            let shortlist =
                getShortlist();

            shortlist.splice(index, 1);

            localStorage.setItem(
                "edumateShortlist",
                JSON.stringify(shortlist)
            );

            render();

        }


        function clearShortlist() {

            if (
                confirm(
                    "Clear your entire shortlist?"
                )
            ) {

                localStorage.removeItem(
                    "edumateShortlist"
                );

                render();

            }

        }


        render();

    </script>

</body>

</html>
